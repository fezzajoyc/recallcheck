name: Recalls sync

on:
  schedule:
    - cron: '0 8 * * *' # 每日:召回是日更事件
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: site-ops
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync recalls
        run: node scripts/sync-recalls.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "fezzajoyc"
          git config user.email "fezzajoyc@users.noreply.github.com"
          git add data/rec/
          if git diff --cached --quiet; then
            echo "no data change"; exit 0
          fi
          git commit -m "sync: recall data [skip ci]" && git push
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --search "🚨 in:title" --state open --json number --jq length)
          if [ "${OPEN:-0}" = "0" ]; then
            gh issue create --title "🚨 recall sync failed — $(date -u '+%F %T') UTC" \
              --body "自动告警:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi

  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Health check live site
        run: node scripts/healthcheck.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --search "🚨 in:title" --state open --json number --jq length)
          if [ "${OPEN:-0}" = "0" ]; then
            gh issue create --title "🚨 healthcheck failed — $(date -u '+%F %T') UTC" \
              --body "自动告警:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi
